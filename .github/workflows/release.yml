name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - name: Build all targets
        run: |
          bun run scripts/build.ts daemon
          for t in bun-linux-x64 bun-linux-arm64 bun-darwin-arm64 bun-darwin-x64; do
            name=$(echo $t | sed 's/^bun-//')
            bun run scripts/build.ts all --target $t --outfile dist/doobie-$name
          done
          cd dist && sha256sum doobie-* > SHA256SUMS && cat SHA256SUMS
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/doobie-*
            dist/SHA256SUMS
      - name: npm publish (only when NPM_TOKEN is configured)
        if: ${{ env.HAS_NPM_TOKEN == 'true' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
