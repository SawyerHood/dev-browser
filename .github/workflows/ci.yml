name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - name: Install Chrome for Testing
        # The installer prints "chrome@<ver> <path>" as its last line (the macOS path
        # contains spaces). Export the path as DEV_BROWSER_CHROME so every test (CLI tests
        # run with DEV_BROWSER_HOME=<tmp>) and the bench use this pinned Chrome instead of
        # whatever the runner image ships.
        run: |
          out=$(bun x @puppeteer/browsers install chrome@stable --path "$HOME/.dev-browser/v1/chrome")
          echo "$out"
          chrome=$(echo "$out" | tail -n 1 | sed 's/^[^ ]* //')
          test -x "$chrome" || { echo "Chrome for Testing binary not found at '$chrome'"; exit 1; }
          echo "DEV_BROWSER_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Check DEV_BROWSER_CHROME
        run: |
          test -n "$DEV_BROWSER_CHROME" && "$DEV_BROWSER_CHROME" --version
      - run: bun run build
      - run: bun run test
      - name: Benchmarks (Linux only; targets x2 for shared runners)
        if: runner.os == 'Linux'
        env:
          DEV_BROWSER_BENCH_SCALE: "2"
        run: bun run bench/run.ts --check --bin dist/dev-browser
