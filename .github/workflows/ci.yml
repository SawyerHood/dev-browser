name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - name: Install Chrome for Testing
        run: bun x @puppeteer/browsers install chrome@stable --path $HOME/.doobie/chrome
      - run: bun run build
      - run: bun run test
      - name: Benchmarks (Linux only; targets x2 for shared runners)
        if: runner.os == 'Linux'
        env:
          DOOBIE_BENCH_SCALE: "2"
        run: bun run bench/run.ts --check --bin dist/doobie
